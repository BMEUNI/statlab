[project]
name = "modelling-agent"
version = "0.1.0"
description = "LLM-driven statistical modelling workbench"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "litellm==1.100.0",
    "mcp==2.2.0",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "numpy==2.5.3",
    "scikit-learn==1.9.0",
    "statsmodels==0.15.0",
    "matplotlib==3.11.1",
    "joblib==1.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "mypy==2.3.1",
    "ruff==0.16.6",
    "pandas-stubs==3.0.5.260730",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/statlab", "mcp_server/statlab_tools", "contracts/statlab_contracts"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "strict"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["backend/statlab", "mcp_server/statlab_tools", "contracts/statlab_contracts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["backend", "mcp_server", "contracts", "tests"]

[[tool.mypy.overrides]]
module = ["litellm.*", "statsmodels.*", "sklearn.*", "matplotlib.*", "joblib.*", "mcp.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["plan"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF", "ANN", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104"]
