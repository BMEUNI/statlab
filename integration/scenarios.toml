[[scenario]]
id = "S05"
title = "Guided mode with edits, an instruction and a skip"
dataset = "churn"
mode = "guided"
max_cost_usd = 0.60

[[scenario.gates]]
node = "problem_definition"
action = "approve_with_edits"
edits = { secondary_metrics = ["pr_auc"] }

[[scenario.gates]]
node = "data_profiling"
action = "skip_node"
reason = "profiling not needed for this test"

[[scenario.gates]]
node = "experiment_design"
phase = "before"
action = "instruct"
instruction = "Use exactly two candidates: one logistic_regression and one random_forest_classifier."

[[scenario.gates]]
node = "preprocessing"
action = "approve_all_remaining"

[scenario.contract.target]
column = "churned"
type = "binary"
positive_class = 1

[scenario.contract.features]
id_columns = ["subscriber_id"]

[scenario.contract.objective]
task = "classification"
primary_metric = "roc_auc"

[[scenario.contract.objective.inference_goals]]
question = "Does plan affect churn?"
predictors = ["plan"]

[[scenario.contract.objective.inference_goals]]
question = "Does region affect churn?"
predictors = ["region"]

[scenario.contract.split]
strategy = "stratified"
seed = 42

[scenario.contract.modelling]
candidates = ["logistic_regression", "random_forest_classifier", "hist_gb_classifier"]
inferential_model = "logit"

[scenario.expect]
status = "completed"
nodes_completed = ["data_quality"]
nodes_skipped = ["data_profiling"]
candidate_count = 2
metrics_in_report = ["pr_auc"]

[scenario.expect.gate_revision_min]
experiment_design = 1

[scenario.offline]
reference_levels = {plan = "premium", region = "north"}
revised_candidates = ["logistic_regression", "random_forest_classifier"]

