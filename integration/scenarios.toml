# Machine-readable scenario definitions; catalogue in SCENARIOS.md.

[[scenario]]
id = "S01"
title = "Classification, autonomous, full path (baseline)"
dataset = "churn"
mode = "autonomous"
max_cost_usd = 0.40

[scenario.contract.target]
column = "churned"
type = "binary"
positive_class = 1

[scenario.contract.features]
id_columns = ["subscriber_id"]

[scenario.contract.objective]
task = "classification"
primary_metric = "roc_auc"

[[scenario.contract.objective.inference_goals]]
question = "Does plan affect churn?"
predictors = ["plan"]

[[scenario.contract.objective.inference_goals]]
question = "Does region affect churn?"
predictors = ["region"]

[scenario.contract.split]
strategy = "stratified"
seed = 42

[scenario.contract.modelling]
candidates = ["logistic_regression", "random_forest_classifier", "hist_gb_classifier"]
inferential_model = "logit"

[scenario.expect]
status = "completed"
nodes_completed = ["intake", "problem_definition", "data_profiling", "data_quality", "data_splitting", "experiment_design", "inferential_analysis", "champion_selection", "artifact_persistence"]
min_candidates_completed = 2
no_gates = true
champion = true
test_scored = true
report_contains = ["Modelling report", "Validation comparison", "Inference"]
pipeline_replay = true
manifest = true

[scenario.soft]
metric_min = 0.6

[scenario.soft.inference]
"Does plan affect churn?" = "reject H0"
"Does region affect churn?" = "not rejected"

[scenario.offline]
reference_levels = {plan = "premium", region = "north"}

[[scenario]]
id = "S02"
title = "Regression, autonomous, missing values"
dataset = "houses"
mode = "autonomous"
max_cost_usd = 0.40

[scenario.contract.target]
column = "price"
type = "continuous"

[scenario.contract.objective]
task = "regression"
primary_metric = "rmse"

[[scenario.contract.objective.inference_goals]]
question = "Does garden affect price?"
predictors = ["has_garden"]

[scenario.contract.split]
strategy = "random"
seed = 42

[scenario.contract.preprocessing.missing]
default = "median"

[scenario.contract.modelling]
candidates = ["linear_regression", "ridge", "random_forest_regressor"]
inferential_model = "ols"

[scenario.expect]
status = "completed"
nodes_completed = ["intake", "problem_definition", "data_profiling", "data_quality", "data_splitting", "experiment_design", "inferential_analysis", "champion_selection", "artifact_persistence"]
min_candidates_completed = 2
no_gates = true
champion = true
test_scored = true
report_contains = ["Modelling report", "Validation comparison", "Inference"]
metrics_in_report = ["rmse"]
pipeline_replay = true
manifest = true
tools_used = ["fit_imputer", "apply_imputer"]

[scenario.soft.inference]
"Does garden affect price?" = "not rejected"

[scenario.offline]
reference_levels = {has_garden = "no"}

